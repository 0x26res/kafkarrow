[build-system]
build-backend = "maturin"
requires = [ "maturin>=1.7,<2" ]

[project]
name = "kafkarrow"
description = "Rust based, Arrow powered, python kafka client"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [ "pyarrow>=14" ]
optional-dependencies.docs = [
  "mkdocs-material>=9",
  "mkdocs-mermaid2-plugin>=1",
  "mkdocstrings[python]>=0.24",
]
urls.changelog = "https://github.com/0x26res/kafkarrow/releases"
urls.documentation = "https://kafkarrow.readthedocs.io/en/latest/"
urls.homepage = "https://github.com/0x26res/kafkarrow"
urls.issues = "https://github.com/0x26res/kafkarrow/issues"
urls.repository = "https://github.com/0x26res/kafkarrow"

[dependency-groups]
dev = [
  "coverage",
  "maturin",
  "pandas>=2.3.3",
  "prek",
  "pytest>=8",
  "tabulate>=0.9",
  "ty",
  "typer>=0.9",
]
docs = [
  "mkdocs-material>=9",
  "mkdocs-mermaid2-plugin>=1",
  "mkdocstrings[python]>=0.24",
]

[tool.maturin]
module-name = "kafkarrow._lib"
python-source = "python"
manifest-path = "kafkarrow-python/Cargo.toml"
features = [ "pyo3/extension-module" ]
