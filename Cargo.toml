[workspace]
exclude = ["tests/arrow-version-independence"]
members = ["kafkarrow", "kafkarrow-core", "kafkarrow-python"]
resolver = "2"

# The release workflows substitute every line of this file matching
# `^version = "..."` with the tag version, keeping this requirement in sync
# with the published kafkarrow-core version.
[workspace.dependencies.kafkarrow-core]
path = "kafkarrow-core"
version = "0.0.1"

[workspace.package]
authors = ["0x26res"]
edition = "2021"
homepage = "https://github.com/0x26res/kafkarrow"
license = "Apache-2.0"
repository = "https://github.com/0x26res/kafkarrow"
version = "0.0.1"
